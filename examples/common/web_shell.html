<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MT2D web</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #111; color: #ddd; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 16px; }
  h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  #stage { width: min(100%, 960px); aspect-ratio: 80 / 25; background: #000; border: 1px solid #333; position: relative; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; outline: none; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa; pointer-events: none; }
  #pad { display: flex; gap: 12px; }
  #pad button { width: 84px; height: 56px; font-size: 1.4rem; border: 1px solid #444; border-radius: 8px;
                background: #222; color: #eee; touch-action: manipulation; user-select: none; }
  #pad button:active { background: #3a3a3a; }
  p { margin: 0; font-size: .85rem; color: #888; }
</style>
</head>
<body>
<h1>MT2D running in the browser</h1>
<div id="stage">
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading...</div>
</div>
<div id="pad">
  <button data-key="ArrowLeft" aria-label="Move left">&larr;</button>
  <button data-key="Enter" aria-label="Restart">&crarr;</button>
  <button data-key="ArrowRight" aria-label="Move right">&rarr;</button>
</div>
<p>Arrow keys or A / D to move. Click the page once to enable the sound. The best score is saved in your browser.</p>
<script>
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
    setStatus: function (t) { statusEl.textContent = t; if (!t) statusEl.style.display = 'none'; },
    onAbort: function () { statusEl.style.display = ''; statusEl.textContent = 'The program crashed, reload the page.'; }
  };
  window.onerror = function () { statusEl.style.display = ''; statusEl.textContent = 'Error, see the console.'; };

  /* The on-screen buttons send the same keyboard events SDL listens to. */
  var CODES = { ArrowLeft: 37, ArrowRight: 39, Enter: 13 };
  function send(type, key) {
    window.dispatchEvent(new KeyboardEvent(type, { key: key, code: key, keyCode: CODES[key], which: CODES[key], bubbles: true }));
  }
  document.querySelectorAll('#pad button').forEach(function (b) {
    var key = b.dataset.key, timer = null;
    function down(e) { e.preventDefault(); send('keydown', key); timer = setInterval(function () { send('keydown', key); }, 90); }
    function up(e) { e.preventDefault(); clearInterval(timer); send('keyup', key); }
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointerleave', up);
    b.addEventListener('pointercancel', up);
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
