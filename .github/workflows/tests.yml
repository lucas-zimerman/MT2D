name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B build/tests
      - name: Build
        run: cmake --build build/tests -j
      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure
